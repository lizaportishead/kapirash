<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapiraš — плеер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@700&display=swap">
<style>
:root{
  --bg:#0F1013; --card:#17181D; --card2:#1A1B20; --line:#24262C; --line2:#3A3C44;
  --text:#F4F1EA; --muted:#B9B4A9; --faint:#8E897F; --accent:#F5C542; --ink:#15161A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif}
button,input{font:inherit}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:16px}}
header{max-width:1100px;margin:0 auto;padding:16px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:'Unbounded',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--card2);color:var(--text);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.on{background:var(--text);color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--ink)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:999px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.player iframe,.player #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.cur{background:var(--card);border-radius:16px;padding:14px 16px;min-height:96px;display:flex;flex-direction:column;gap:8px}
.tokens{display:flex;flex-wrap:wrap;column-gap:7px}
.tok{padding:4px 0;border:0;background:transparent;color:var(--text);font:700 22px/1.3 'Manrope',sans-serif;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:rgba(244,241,234,.25)}
.tok.saved{text-decoration-color:var(--accent)}
.tok:hover{color:var(--accent)}
.ru{font-size:16px;font-weight:600;line-height:1.4;color:var(--accent)}
.hint{font-size:14px;color:var(--muted);line-height:1.5}
h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.panel{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.transcript{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.row{display:flex;gap:12px;text-align:left;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font:inherit}
.row.now{background:var(--line);color:var(--text)}
.row .t{flex:none;width:44px;font-size:12px;font-weight:700;color:var(--faint);padding-top:2px}
.row .s{font-size:15px;font-weight:700;line-height:1.35}
.row .r{font-size:13px;color:var(--muted);line-height:1.35}
.words{display:flex;flex-direction:column}
.w{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.w .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w .wd{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;background:none;border:0;color:var(--text);padding:0;text-align:left;cursor:pointer}
.w .ctx{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);color:var(--muted);cursor:pointer;flex:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);border:0;display:none;cursor:pointer}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:var(--card2);border-radius:24px 24px 0 0;padding:14px 24px 28px;display:none;flex-direction:column;gap:14px}
.open .sheet-bg{display:block}.open .sheet{display:flex}
.sheet .big{font-family:'Unbounded',sans-serif;font-size:30px;font-weight:700;line-height:1.1;word-break:break-word}
.sheet .alt{font-size:15px;color:var(--muted)}
.sheet .ctx{padding:12px 14px;border-radius:12px;background:var(--line);font-size:15px;line-height:1.45;color:#D9D4C9}
.sheet .tr{display:flex;flex-direction:column;gap:4px;min-height:52px}
.sheet .tr .main{font-size:22px;font-weight:800;line-height:1.25;color:var(--accent)}
.sheet .tr .note{font-size:14px;line-height:1.45;color:var(--muted)}
.sheet .tr .err{font-size:14px;color:#FF8A7A}
.sheet .keyform{display:flex;gap:8px}
.sheet .keyform input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 12px}
.w .tr{font-size:13px;font-weight:600;color:var(--accent)}
.empty{font-size:14px;color:var(--muted)}
footer{max-width:1100px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<header>
  <div class="logo">Kapiraš<span>?</span></div>
</header>

<div class="wrap">
  <main style="display:flex;flex-direction:column;gap:12px;min-width:0">
    <div class="player"><div id="yt"></div></div>
    <div class="controls">
      <button class="btn sm on" id="tSr" type="button" aria-pressed="true">SR</button>
      <button class="btn sm on" id="tRu" type="button" aria-pressed="true">RU</button>
      <button class="btn sm" id="tScript" type="button" aria-label="Алфавит сербских субтитров">Lat</button>
      <span class="spacer"></span>
      <button class="btn sm" id="back" type="button" aria-label="Предыдущая фраза">‹ фраза</button>
      <button class="btn sm" id="again" type="button" aria-label="Повторить фразу">Ещё раз</button>
      <button class="btn sm" id="fwd" type="button" aria-label="Следующая фраза">фраза ›</button>
    </div>
    <section class="cur" aria-live="polite">
      <div class="tokens" id="tokens" lang="sr"></div>
      <div class="ru" id="ruLine"></div>
      <div class="hint" id="curHint">Перетащи на страницу файл субтитров (.vtt или .srt) — и фразы появятся здесь. По любому слову можно нажать.</div>
    </section>
    <section class="panel">
      <h2>Весь текст</h2>
      <div class="transcript" id="transcript"><div class="empty">Пока пусто.</div></div>
    </section>
  </main>

  <aside class="side" style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <section class="panel">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <h2>Мои слова</h2>
        <button class="btn sm" id="copyWords" type="button">Скопировать</button>
      </div>
      <div class="words" id="words"><div class="empty">Нажми на слово в субтитрах и сохрани его.</div></div>
    </section>
  </aside>
</div>
<footer>Видео воспроизводится официальным плеером YouTube. Субтитры и словарь хранятся только в этом браузере.</footer>

<div id="sheetRoot">
  <button class="sheet-bg" id="sheetBg" type="button" aria-label="Закрыть"></button>
  <div class="sheet" role="dialog" aria-label="Слово">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <div class="big" id="sWord" lang="sr"></div>
        <div class="alt" id="sAlt"></div>
      </div>
      <button class="x" id="sClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div class="ctx" id="sCtx" lang="sr"></div>
    <div class="tr" id="sTr" aria-live="polite"></div>
    <button class="btn acc" id="sSave" type="button" style="height:52px">Добавить в мои слова</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  // ---- transliteration ----
  const L2C = {a:'а',b:'б',c:'ц','č':'ч','ć':'ћ',d:'д','dž':'џ','đ':'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',lj:'љ',m:'м',n:'н',nj:'њ',o:'о',p:'п',r:'р',s:'с','š':'ш',t:'т',u:'у',v:'в',z:'з','ž':'ж'};
  const C2L = {}; Object.keys(L2C).forEach(k => C2L[L2C[k]] = k);
  const caseLike = (src, out) => src[0] !== src[0].toLowerCase() ? out.charAt(0).toUpperCase() + out.slice(1) : out;
  const toCyr = (s) => s.replace(/lj|nj|dž|./gi, (m) => { const c = L2C[m.toLowerCase()]; return c ? caseLike(m, c) : m; });
  const toLat = (s) => s.replace(/./g, (m) => { const c = C2L[m.toLowerCase()]; return c ? caseLike(m, c) : m; });
  const clean = (w) => w.replace(/[^\p{L}\p{N}'-]/gu, '');

  // ---- state ----
  const st = {
    videoId: null, sr: [], ru: [], showSr: true, showRu: true,
    script: store.get('kap.script', 'lat'),
    words: store.get('kap.words', []),
    cur: -1, sheet: null, dict: null
  };
  const conv = (s) => st.script === 'cyr' ? toCyr(s) : toLat(s);

  // ---- subtitle parsing (SRT / VTT, incl. YouTube auto-captions) ----
  function ts(t){
    const p = t.trim().replace(',', '.').split(':').map(Number);
    return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
  }
  function parseSubs(text){
    const blocks = text.replace(/\r/g,'').split(/\n\n+/);
    const raw = [];
    blocks.forEach(b => {
      const lines = b.split('\n');
      const i = lines.findIndex(l => l.includes('-->'));
      if (i < 0) return;
      const m = lines[i].match(/([\d:.,]+)\s*-->\s*([\d:.,]+)/);
      if (!m) return;
      raw.push({ start: ts(m[1]), end: ts(m[2]), lines: lines.slice(i + 1) });
    });
    const isAuto = /<\d\d:\d\d:\d\d\.\d+>|<c>/.test(text);
    const strip = (s) => s.replace(/<[^>]+>/g, '').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
    let cues = [];
    if (isAuto) {
      raw.forEach(c => {
        const fresh = c.lines.filter(l => /<\d\d:\d\d:\d\d\.\d+>|<c>/.test(l)).map(strip).join(' ').trim();
        if (fresh) cues.push({ start: c.start, end: c.end, text: fresh });
      });
      for (let k = 0; k < cues.length - 1; k++) cues[k].end = Math.max(cues[k].end, cues[k+1].start);
    } else {
      cues = raw.map(c => ({ start: c.start, end: c.end, text: strip(c.lines.join(' ')) })).filter(c => c.text);
    }
    return cues;
  }
  const at = (list, t) => { for (let i = 0; i < list.length; i++) if (t >= list[i].start && t < list[i].end) return i; return -1; };
  const fmt = (s) => { s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,'0'); return h ? h + ':' + String(m).padStart(2,'0') + ':' + x : m + ':' + x; };

  // ---- YouTube player ----
  let player = null, ready = false;
  function parseId(v){
    v = v.trim();
    const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : (/^[\w-]{11}$/.test(v) ? v : null);
  }
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('yt', {
      videoId: st.videoId,
      playerVars: { playsinline: 1, rel: 0, cc_load_policy: 0, hl: 'ru' },
      events: { onReady: () => { ready = true; } }
    });
  };
  function loadVideo(id){
    st.videoId = id;
    const saved = store.get('kap.subs.' + id, null);
    st.sr = saved ? saved.sr : []; st.ru = saved ? saved.ru : [];
    st.cur = -1;
    renderTranscript(); renderCurrent();
    if (player && ready) player.loadVideoById(id);
    // готовый словарик ролика: <id>.dict.json, { "слово": ["перевод", "пометка"] }
    st.dict = fetch(id + '.dict.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
    // если рядом со страницей лежат <id>.sr.vtt / <id>.ru.vtt — подхватываем их сами
    ['sr', 'ru'].forEach(lang => {
      if ((lang === 'sr' ? st.sr : st.ru).length) return;
      fetch(id + '.' + lang + '.vtt').then(r => r.ok ? r.text() : null).then(txt => {
        if (!txt || st.videoId !== id || !/-->/.test(txt)) return;
        const cues = parseSubs(txt);
        if (lang === 'ru') st.ru = cues; else st.sr = cues;
        renderTranscript(); renderCurrent(); markTranscript();
      }).catch(() => {});
    });
  }
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);

  // ---- rendering ----
  function isSaved(w){ const k = toLat(clean(w)).toLowerCase(); return st.words.some(x => x.key === k); }
  function renderCurrent(){
    const tokens = $('tokens'); tokens.textContent = '';
    const c = st.sr[st.cur];
    $('curHint').style.display = st.sr.length ? 'none' : '';
    if (c && st.showSr) {
      c.text.split(' ').forEach(w => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'tok' + (isSaved(w) ? ' saved' : '');
        b.textContent = conv(w);
        b.addEventListener('click', () => openSheet(w, c));
        tokens.appendChild(b);
      });
    }
    let ruText = '';
    if (st.showRu && st.ru.length) {
      const t = c ? (c.start + c.end) / 2 : (player && ready ? player.getCurrentTime() : -1);
      const j = at(st.ru, t);
      ruText = j >= 0 ? st.ru[j].text : '';
    }
    $('ruLine').textContent = ruText;
  }
  function renderTranscript(){
    const box = $('transcript'); box.textContent = '';
    if (!st.sr.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Пока пусто.'; box.appendChild(e); return; }
    st.sr.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'row' + (i === st.cur ? ' now' : ''); b.dataset.i = i;
      const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(c.start);
      const body = document.createElement('span'); body.style.display = 'flex'; body.style.flexDirection = 'column'; body.style.gap = '2px';
      const sr = document.createElement('span'); sr.className = 's'; sr.lang = 'sr'; sr.textContent = conv(c.text);
      body.appendChild(sr);
      if (st.showRu && st.ru.length) {
        const j = at(st.ru, (c.start + c.end) / 2);
        if (j >= 0) { const r = document.createElement('span'); r.className = 'r'; r.textContent = st.ru[j].text; body.appendChild(r); }
      }
      b.appendChild(t); b.appendChild(body);
      b.addEventListener('click', () => seek(c.start));
      box.appendChild(b);
    });
  }
  function markTranscript(){
    const box = $('transcript');
    box.querySelectorAll('.row.now').forEach(r => r.classList.remove('now'));
    const row = box.querySelector('.row[data-i="' + st.cur + '"]');
    if (row) {
      row.classList.add('now');
      const top = row.offsetTop - box.offsetTop - box.clientHeight / 3;
      box.scrollTo({ top: top, behavior: 'smooth' });
    }
  }
  function renderWords(){
    const box = $('words'); box.textContent = '';
    if (!st.words.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Нажми на слово в субтитрах и сохрани его.'; box.appendChild(e); return; }
    st.words.slice().reverse().forEach(w => {
      const row = document.createElement('div'); row.className = 'w';
      const main = document.createElement('div'); main.className = 'main';
      const wd = document.createElement('button'); wd.type = 'button'; wd.className = 'wd'; wd.lang = 'sr';
      wd.textContent = conv(w.word);
      wd.title = 'Перейти к месту в видео';
      wd.addEventListener('click', () => { if (w.video === st.videoId) seek(w.t); else loadVideo(w.video); });
      const ctx = document.createElement('div'); ctx.className = 'ctx'; ctx.textContent = conv(w.ctx);
      main.appendChild(wd);
      if (w.tr) { const tr = document.createElement('div'); tr.className = 'tr'; tr.textContent = w.tr; main.appendChild(tr); }
      main.appendChild(ctx);
      const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Удалить ' + w.word);
      x.addEventListener('click', () => { st.words = st.words.filter(y => y.key !== w.key); store.set('kap.words', st.words); renderWords(); renderCurrent(); });
      row.appendChild(main); row.appendChild(x); box.appendChild(row);
    });
  }
  function refreshToggles(){
    $('tSr').classList.toggle('on', st.showSr); $('tSr').setAttribute('aria-pressed', st.showSr);
    $('tRu').classList.toggle('on', st.showRu); $('tRu').setAttribute('aria-pressed', st.showRu);
    $('tScript').textContent = st.script === 'cyr' ? 'Ћир' : 'Lat';
  }

  // ---- actions ----
  function seek(t){ if (player && ready) { player.seekTo(Math.max(0, t - 0.15), true); player.playVideo(); } }
  function stepLine(d){
    if (!st.sr.length) return;
    const i = Math.min(st.sr.length - 1, Math.max(0, (st.cur < 0 ? 0 : st.cur) + d));
    seek(st.sr[i].start);
  }
  function openSheet(w, cue){
    const word = clean(w); if (!word) return;
    if (player && ready) player.pauseVideo();
    const lat = toLat(word), cyr = toCyr(lat);
    st.sheet = { word: lat, ctx: cue.text, t: cue.start };
    $('sWord').textContent = st.script === 'cyr' ? cyr : lat;
    $('sAlt').textContent = (st.script === 'cyr' ? lat : cyr) + ' · ' + fmt(cue.start);
    $('sCtx').textContent = conv(cue.text);
    translate(st.sheet);
    $('sSave').textContent = isSaved(word) ? 'Уже в моих словах' : 'Добавить в мои слова';
    document.body.classList.add('open');
    $('sClose').focus();
  }
  // ---- LLM translation (Gemini или Anthropic API, ключ хранится только в этом браузере) ----
  const trCache = store.get('kap.tr', {});
  function showTr(cls, text, note){
    const box = $('sTr'); box.textContent = '';
    const a = document.createElement('div'); a.className = cls; a.textContent = text; box.appendChild(a);
    if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; box.appendChild(n); }
    return box;
  }
  function askKey(sheet, msg){
    const box = showTr('err', msg);
    const f = document.createElement('form'); f.className = 'keyform';
    const inp = document.createElement('input'); inp.type = 'password'; inp.placeholder = 'API-ключ'; inp.autocomplete = 'off'; inp.setAttribute('aria-label', 'API-ключ');
    const b = document.createElement('button'); b.type = 'submit'; b.className = 'btn'; b.textContent = 'Сохранить';
    f.appendChild(inp); f.appendChild(b); box.appendChild(f);
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const k = inp.value.trim(); if (!k) return;
      store.set('kap.key', k); translate(sheet);
    });
  }
  function translate(sheet){
    const ck = sheet.word.toLowerCase() + '|' + sheet.ctx;
    const hit = trCache[ck];
    if (hit) { sheet.tr = hit.tr; showTr('main', hit.tr, hit.note); return; }
    Promise.resolve(st.dict).then(dict => {
      if (st.sheet !== sheet) return;
      const e = dict && dict[sheet.word.toLowerCase()];
      if (e) { sheet.tr = e[0]; showTr('main', e[0], e[1]); return; }
      const key = store.get('kap.key', '');
      if (!key) { showTr('note', 'Этого слова нет в словарике ролика.'); return; }
      askLLM(sheet, ck, key);
    });
  }
  function askLLM(sheet, ck, key){
    showTr('note', 'Перевожу…');
    const sys = 'Ты помогаешь русскоязычному человеку учить сербский по субтитрам. Тебе дают слово и фразу, в которой оно встретилось. Ответь строго JSON-объектом без пояснений: {"tr": "перевод слова на русский именно в этом контексте, 1–4 слова", "note": "начальная форма слова и её основной перевод; если нужно — короткая пометка о форме или другом значении. Одна строка."}';
    const user = 'Слово: ' + sheet.word + '\nФраза: ' + sheet.ctx;
    // ключ Anthropic начинается с sk-ant-, всё остальное считаем ключом Gemini (Google AI Studio)
    const gem = !/^sk-ant-/.test(key);
    const req = gem
      ? fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: sys }] },
            contents: [{ role: 'user', parts: [{ text: user }] }],
            generationConfig: { responseMimeType: 'application/json' }
          })
        })
      : fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'content-type': 'application/json', 'x-api-key': key,
            'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({ model: 'claude-haiku-5-5', max_tokens: 300, system: sys, messages: [{ role: 'user', content: user }] })
        });
    req.then(r => r.json().then(j => ({ status: r.status, j: j }))).then(({ status, j }) => {
      if (st.sheet !== sheet) return;
      const msg = (j.error && j.error.message) || ('HTTP ' + status);
      if (status === 401 || status === 403 || /API key not valid/i.test(msg)) { store.set('kap.key', ''); askKey(sheet, 'Ключ не подошёл. Проверь и введи ещё раз.'); return; }
      if (status === 429) throw new Error('слишком много запросов, попробуй через минуту');
      if (status !== 200) throw new Error(msg);
      const txt = (gem
        ? (((j.candidates || [])[0] || {}).content || {}).parts || []
        : (j.content || []).filter(b => b.type === 'text')).map(b => b.text || '').join('').trim();
      let res; try { res = JSON.parse((txt.match(/\{[\s\S]*\}/) || [txt])[0]); } catch(e){ res = { tr: txt, note: '' }; }
      res = { tr: String(res.tr || txt), note: String(res.note || '') };
      trCache[ck] = res; store.set('kap.tr', trCache);
      sheet.tr = res.tr; showTr('main', res.tr, res.note);
    }).catch(e => { if (st.sheet === sheet) showTr('err', 'Не получилось перевести: ' + e.message); });
  }
  function closeSheet(){ document.body.classList.remove('open'); st.sheet = null; }
  $('sClose').addEventListener('click', closeSheet);
  $('sheetBg').addEventListener('click', closeSheet);
  $('sSave').addEventListener('click', () => {
    const s0 = st.sheet; if (!s0) return;
    const key = s0.word.toLowerCase();
    if (!st.words.some(x => x.key === key)) {
      st.words.push({ key: key, word: s0.word.toLowerCase(), tr: s0.tr || '', ctx: s0.ctx, t: s0.t, video: st.videoId });
      store.set('kap.words', st.words);
    }
    closeSheet(); renderWords(); renderCurrent();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('open')) closeSheet(); });

  $('tSr').addEventListener('click', () => { st.showSr = !st.showSr; refreshToggles(); renderCurrent(); });
  $('tRu').addEventListener('click', () => { st.showRu = !st.showRu; refreshToggles(); renderCurrent(); renderTranscript(); markTranscript(); });
  $('tScript').addEventListener('click', () => { st.script = st.script === 'cyr' ? 'lat' : 'cyr'; store.set('kap.script', st.script); refreshToggles(); renderCurrent(); renderTranscript(); markTranscript(); renderWords(); });
  $('back').addEventListener('click', () => stepLine(-1));
  $('fwd').addEventListener('click', () => stepLine(1));
  $('again').addEventListener('click', () => stepLine(0));
  $('copyWords').addEventListener('click', () => {
    const txt = st.words.map(w => w.word + '\t' + (w.tr || '') + '\t' + w.ctx).join('\n');
    try { navigator.clipboard.writeText(txt); $('copyWords').textContent = 'Скопировано'; setTimeout(() => $('copyWords').textContent = 'Скопировать', 1500); } catch(e){}
  });

  function takeFile(file, lang){
    if (!file) return;
    file.text().then(txt => {
      const cues = parseSubs(txt);
      if (lang === 'ru') st.ru = cues; else st.sr = cues;
      store.set('kap.subs.' + st.videoId, { sr: st.sr, ru: st.ru });
      renderTranscript(); renderCurrent(); markTranscript();
    });
  }
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    Array.from(e.dataTransfer.files).forEach(f => takeFile(f, /\.ru[.-]|[._-]ru\./i.test(f.name) ? 'ru' : 'sr'));
  });

  // ---- sync loop ----
  setInterval(() => {
    if (!player || !ready || !st.sr.length || typeof player.getCurrentTime !== 'function') return;
    const t = player.getCurrentTime();
    let i = at(st.sr, t);
    if (i < 0) { for (let k = st.sr.length - 1; k >= 0; k--) if (st.sr[k].start <= t) { i = k; break; } }
    if (i !== st.cur) { st.cur = i; renderCurrent(); markTranscript(); }
  }, 200);

  refreshToggles(); renderWords();
  loadVideo(parseId(new URLSearchParams(location.search).get('v') || '') || 'dxE0__WvLBU');
})();
</script>
</body>
</html>

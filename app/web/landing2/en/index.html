<style>
:root { --lime:#E6EC68; --violet:#7357F6; --bg:#0E0E12; --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:#fff; font-family:var(--font); overflow-x:hidden; }
a { color:inherit; text-decoration:none; }
a:focus-visible { outline:3px solid var(--lime); outline-offset:3px; }
.hero { position:relative; overflow:hidden; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; background:linear-gradient(180deg, var(--bg) 0%, var(--bg) 38%, #2a1f66 78%, #443389 100%); }
.glow { position:absolute; right:12%; top:60px; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle, rgba(115,87,246,.45), transparent 65%); pointer-events:none; }
.wrap { position:relative; z-index:2; max-width:1100px; width:100%; margin:0 auto; padding:0 24px; }
.hero > .wrap { flex:1; display:flex; flex-direction:column; }
.nav { display:flex; align-items:center; height:72px; }
.logo { font-weight:900; font-size:24px; letter-spacing:-.8px; }
.logo b { color:var(--lime); }
.sp { flex:1; }
.lang { display:flex; gap:2px; margin-right:20px; font-size:13px; font-weight:800; }
.lang a { padding:6px 8px; border-radius:8px; color:rgba(255,255,255,.55); }
.lang a[aria-current="true"] { color:#fff; background:rgba(255,255,255,.14); }
.nav a.link { font-weight:700; font-size:14px; color:rgba(255,255,255,.7); padding:10px 0; }
.cols { --pw:300px; display:grid; grid-template-columns:1fr var(--pw); gap:48px; align-items:stretch; min-height:0; flex:1; }
.copy { align-self:center; padding-bottom:60px; }
h1 { margin:0; font-weight:900; font-size:clamp(36px,4vw,56px); line-height:1.03; letter-spacing:-.03em; }
h1 span { display:block; color:var(--lime); }
.lead { margin:24px 0 0; max-width:420px; font-size:18px; font-weight:500; line-height:1.45; color:rgba(255,255,255,.72); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:24px 0 0; padding:0; list-style:none; }
.chips li { display:inline-flex; align-items:center; gap:8px; height:48px; padding:0 20px; border-radius:99px; background:transparent; border:1px solid rgba(255,255,255,.28); font-size:15px; font-weight:800; }
.btn { display:inline-flex; align-items:center; justify-content:center; height:56px; padding:0 36px; border-radius:99px; background:var(--lime); color:#111; font-weight:800; font-size:16px; margin-top:32px; }
.phone-wrap { width:var(--pw); margin:24px 0 40px; align-self:center; justify-self:center; }
.phone { position:relative; width:100%; padding:calc(var(--pw) * .03); border-radius:calc(var(--pw) * .15); background:#0b0b0f; box-shadow:0 0 0 calc(var(--pw) * .006) #3b3b42, inset 0 0 0 calc(var(--pw) * .006) #26262c, 0 40px 80px rgba(0,0,0,.45), 0 0 90px rgba(115,87,246,.28); }
.phone .scr { position:relative; width:100%; aspect-ratio:458 / 918; overflow:hidden; background:#fff; border-radius:calc(var(--pw) * .125); }
.phone video { position:absolute; width:419.2%; height:auto; left:-253.5%; top:0; margin-top:-18.34%; pointer-events:none; }
.phone .btn-s { position:absolute; width:calc(var(--pw) * .012); background:#2b2b31; border-radius:2px; }
.phone .btn-s.l1 { left:calc(var(--pw) * -.011); top:12%; height:3.5%; }
.phone .btn-s.l2 { left:calc(var(--pw) * -.011); top:19%; height:6.5%; }
.phone .btn-s.l3 { left:calc(var(--pw) * -.011); top:27.5%; height:6.5%; }
.phone .btn-s.r1 { right:calc(var(--pw) * -.011); top:21%; height:10%; }
.how { background:var(--bg); padding:88px 0; }
.how h2 { margin:0 0 48px; text-align:center; font-weight:900; font-size:clamp(30px,4vw,48px); letter-spacing:-.03em; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
.card { background:#17171d; border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:28px; }
.card h3 { margin:0 0 12px; font-size:22px; font-weight:900; color:var(--lime); }
.card p { margin:0; font-size:16px; line-height:1.5; color:rgba(255,255,255,.72); }
.end { text-align:center; padding:0 24px 96px; }
.end h2 { margin:0 0 12px; font-size:clamp(28px,4vw,44px); font-weight:900; letter-spacing:-.03em; }
.end p { margin:0 0 8px; color:rgba(255,255,255,.7); }
@media (max-width:860px) {
  .cols { --pw:min(300px,72vw); grid-template-columns:1fr; gap:0; min-height:0; }
  .copy { padding:24px 0 36px; text-align:center; }
  .lead { margin-inline:auto; }
  .chips { justify-content:center; }
  .phone-wrap { align-self:center; margin:0 0 32px; }
  .hero > .wrap { display:flex; flex-direction:column; }
  .glow { right:50%; margin-right:-260px; top:300px; }
  .cards { grid-template-columns:1fr; }
}
</style>
<script>
(function(){try{
  var ua=navigator.userAgent||'';if(/bot|crawl|spider|slurp|google|bing|yandex|preview/i.test(ua))return;
  var saved=localStorage.getItem('kap.landing.lang');
  var want=saved||((navigator.language||'en').toLowerCase().match(/^(ru|uk|be|kk)/)?'ru':'en');
  if(want==='en'&&location.pathname.indexOf('/en/')<0)location.replace('/landing2/en/'+location.search);
  if(want==='ru'&&location.pathname.indexOf('/en/')>=0)location.replace('/landing2/'+location.search);
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-lang]');if(a)localStorage.setItem('kap.landing.lang',a.getAttribute('data-lang'));});
}catch(e){}})();
</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kapiraš?","url":"https://kapiras.app/","applicationCategory":"EducationalApplication","operatingSystem":"Web, iOS","inLanguage":["en","sr"],"description":"An app for learning Serbian through videos, podcasts and books with subtitles and translation."}</script>
</head>
<body>
<header class="hero">
  <div class="glow"></div>
  <div class="wrap">
    <nav class="nav" aria-label="Main navigation">
      <a class="logo" href="/landing2/en/">Kapiraš<b>?</b></a><span class="sp"></span>
      <div class="lang" role="group" aria-label="Language"><a href="/landing2/" hreflang="ru" lang="ru" data-lang="ru">RU</a><a href="/landing2/en/" hreflang="en" lang="en" aria-current="true" data-lang="en">EN</a></div>
      <a class="link" href="/?auth">Sign in</a>
    </nav>
    <div class="cols">
      <div class="copy">
        <h1>The lazy way <span>to learn Serbian</span></h1>
        <p class="lead">Learn new words with interesting videos and podcasts</p>
        <ul class="chips"><li><span aria-hidden="true">🎬</span>Videos</li><li><span aria-hidden="true">📱</span>Shorts</li><li><span aria-hidden="true">📖</span>Books</li><li><span aria-hidden="true">🎧</span>Podcasts</li></ul>
        <a class="btn" href="/?auth">Get started</a>
      </div>
      <div class="phone-wrap">
        <div class="phone">
          <i class="btn-s l1"></i><i class="btn-s l2"></i><i class="btn-s l3"></i><i class="btn-s r1"></i>
          <div class="scr"><video src="/kapiras-demo-full.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Kapiraš app demo: a video with subtitles and word translations"></video></div>
        </div>
      </div>
    </div>
  </div>
</header>

</body>
</html>

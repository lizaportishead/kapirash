name: Deploy web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'site/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Flutter app (served from /app/)
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn --base-href /app/
      - name: Assemble site (landing at /, app at /app/)
        run: |
          mkdir -p public
          cp -R site/. public/
          mkdir -p public/app
          cp -R app/build/web/. public/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
